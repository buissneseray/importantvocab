<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vokabeln: Le monde du travail</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2433;--mute:#6b7384;--acc:#2f5bea;--ok:#1f9d63;--bad:#d9534f;--line:#dcd8cf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181f;--card:#1f2430;--ink:#eceff5;--mute:#98a0b3;--acc:#7b9bff;--ok:#4cc38a;--bad:#ef7773;--line:#323a4b}}
:root[data-theme="dark"]{--bg:#15181f;--card:#1f2430;--ink:#eceff5;--mute:#98a0b3;--acc:#7b9bff;--ok:#4cc38a;--bad:#ef7773;--line:#323a4b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:520px;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
button,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .2s}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:14px}
.scene{perspective:1000px;margin:14px 0}
.card{position:relative;height:260px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.back{transform:rotateY(180deg)}
.word{font-size:30px;font-weight:700}
.ex{margin-top:14px;color:var(--mute);font-style:italic}
.hint{position:absolute;bottom:12px;font-size:12px;color:var(--mute)}
.nav{display:flex;gap:8px}
.nav button{flex:1;font-weight:600}
.ok{border-color:var(--ok);color:var(--ok)}
.bad{border-color:var(--bad);color:var(--bad)}
.end{text-align:center;padding:50px 10px;background:var(--card);border-radius:18px;border:1px solid var(--line)}
</style>
</head>
<body>
<div class="app">
  <h1>Vokabeln: Le monde du travail</h1>
  <div class="row" id="sets"></div>
  <div class="row">
    <button id="dir">FR → DE</button>
    <button id="shuf">Mischen</button>
    <button id="reset">Neu starten</button>
  </div>
  <div class="meta"><span id="pos"></span><span id="score"></span></div>
  <div class="bar"><i id="prog"></i></div>
  <div id="stage"></div>
</div>
<script>
const DATA={
Verben:[
["chercher","suchen","Sam cherche un job."],["trouver","finden","J'ai trouvé une annonce."],["travailler","arbeiten","Tu travailles le samedi."],["servir","bedienen","Tu sers les clients."],["aider","helfen","Tu aides les clients."],["préparer","vorbereiten","Tu prépares les salles."],["nourrir","füttern","Tu nourris les animaux."],["nettoyer","putzen, reinigen","Tu nettoies les cages."],["conseiller","beraten, raten","Tu conseilles les clients."],["gagner de l'argent","Geld verdienen","Tu gagnes de l'argent."],["apprendre","lernen","Tu apprends beaucoup."],["aimer","mögen, gern haben","Tu aimes les animaux."],["plaire","gefallen","Ce job pourrait te plaire."],["devoir","müssen","Tu dois te lever tôt."],["pouvoir","können","Tu peux travailler le soir."],["se lever","aufstehen","Tu dois te lever à 6 h."],["commencer","anfangen","Le travail commence à 7 h."],["finir","enden, beenden","Tu finis à midi."],["dormir","schlafen","Tu peux dormir plus longtemps."],["contacter","kontaktieren","Je contacterais le cinéma."],["envoyer","schicken","Tu peux envoyer un message."],["poser sa candidature","sich bewerben","Je poserais ma candidature."],["choisir","wählen","Je choisirais le cinéma."],["penser","denken, meinen","Je pense que c'est bien."],["demander","fragen","Tu peux demander des informations."],["expliquer","erklären","Tu peux expliquer pourquoi."]],
Nomen:[
["un job","der Job",""],["une annonce","die Anzeige",""],["une offre d'emploi","das Stellenangebot",""],["un avantage","der Vorteil","L'avantage, c'est que…"],["un inconvénient","der Nachteil","L'inconvénient, c'est que…"],["une difficulté","die Schwierigkeit",""],["une qualité","die Eigenschaft, Stärke",""],["une compétence","die Fähigkeit",""],["un client / une cliente","der Kunde / die Kundin",""],["une équipe","das Team",""],["un café","das Café",""],["un cinéma","das Kino",""],["une salle","der Saal",""],["une animalerie","die Tierhandlung",""],["un animal / des animaux","das Tier / die Tiere",""],["une cage","der Käfig",""],["un magasin","das Geschäft",""],["une candidature","die Bewerbung",""],["l'argent","das Geld",""],["une expérience","die Erfahrung",""],["un conseil","der Ratschlag",""],["un jeune","der Jugendliche",""],["le week-end","das Wochenende",""],["les vacances d'été","die Sommerferien",""],["le matin / le soir","der Morgen / der Abend",""],["un ami / une amie","der Freund / die Freundin",""]],
Eigenschaften:[
["sociable","gesellig, kontaktfreudig",""],["responsable","verantwortungsbewusst",""],["patient(e)","geduldig",""],["motivé(e)","motiviert",""],["flexible","flexibel",""],["rapide","schnell",""],["poli(e)","höflich",""],["sympathique","sympathisch",""],["intéressant","interessant",""],["difficile","schwierig",""],["fatigant","anstrengend",""],["agréable","angenehm",""],["tôt","früh",""],["tard","spät",""]],
Conditionnel:[
["tu pourrais","du könntest","Tu pourrais envoyer un message."],["tu devrais","du solltest / müsstest","Tu devrais te lever tôt."],["tu servirais","du würdest bedienen",""],["tu aiderais","du würdest helfen",""],["tu préparerais","du würdest vorbereiten",""],["ce serait","das wäre","Ce serait agréable."],["je choisirais","ich würde wählen",""],["je contacterais","ich würde kontaktieren",""],["je poserais ma candidature","ich würde mich bewerben",""],["À ta place, je…","An deiner Stelle würde ich…",""],["À mon avis…","Meiner Meinung nach…",""],["Je te conseille de…","Ich rate dir, zu…",""]],
Verbindungen:[
["mais","aber",""],["parce que","weil",""],["donc","also, deshalb",""],["aussi","auch",""],["en plus","außerdem",""],["par contre","dagegen, andererseits",""],["très","sehr",""],["trop","zu (viel)",""],["Bonne chance !","Viel Glück!",""],["À bientôt !","Bis bald!",""],["À plus !","Bis später!",""],["Qu'est-ce que tu en penses ?","Was denkst du darüber?",""]]
};
let set="Alle",dirFR=true,deck=[],i=0,flipped=false,known=0;
const $=id=>document.getElementById(id);
function all(){return Object.values(DATA).flat()}
function build(){
  deck=(set==="Alle"?all():DATA[set]).slice();i=0;flipped=false;known=0;render();
}
function shuffle(){for(let k=deck.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[deck[k],deck[j]]=[deck[j],deck[k]]}i=0;flipped=false;known=0;render()}
function setsUI(){
  const names=["Alle",...Object.keys(DATA)];
  $("sets").innerHTML="";
  names.forEach(n=>{const b=document.createElement("button");b.textContent=n;if(n===set)b.className="on";b.onclick=()=>{set=n;setsUI();build()};$("sets").appendChild(b)});
}
function render(){
  const st=$("stage");
  $("pos").textContent=i<deck.length?`Karte ${i+1} / ${deck.length}`:"Fertig";
  $("score").textContent=`Gewusst: ${known}`;
  $("prog").style.width=(deck.length?i/deck.length*100:0)+"%";
  if(i>=deck.length){
    st.innerHTML=`<div class="end"><h2>Geschafft! 🎉</h2><p>Du hast ${known} von ${deck.length} gewusst.</p><button class="on" onclick="build()">Nochmal</button></div>`;return;
  }
  const c=deck[i],front=dirFR?c[0]:c[1],back=dirFR?c[1]:c[0];
  st.innerHTML=`<div class="scene"><div class="card ${flipped?"flip":""}" id="card"><div class="face"><div class="word">${front}</div><div class="hint">Klicken zum Umdrehen</div></div><div class="face back"><div class="word">${back}</div>${c[2]?`<div class="ex">${c[2]}</div>`:""}</div></div></div>
  <div class="nav"><button id="prev">← Zurück</button><button class="bad" id="again">Nochmal</button><button class="ok" id="know">Gewusst →</button></div>`;
  $("card").onclick=()=>{flipped=!flipped;$("card").classList.toggle("flip",flipped)};
  $("prev").onclick=()=>{if(i>0){i--;flipped=false;render()}};
  $("know").onclick=()=>{known++;i++;flipped=false;render()};
  $("again").onclick=()=>{const c=deck.splice(i,1)[0];deck.push(c);flipped=false;render()};
}
$("dir").onclick=()=>{dirFR=!dirFR;$("dir").textContent=dirFR?"FR → DE":"DE → FR";flipped=false;render()};
$("shuf").onclick=shuffle;
$("reset").onclick=build;
document.addEventListener("keydown",e=>{
  if(i>=deck.length)return;
  if(e.code==="Space"){e.preventDefault();flipped=!flipped;$("card").classList.toggle("flip",flipped)}
  else if(e.key==="ArrowRight")$("know").click();
  else if(e.key==="ArrowLeft")$("prev").click();
  else if(e.key==="ArrowDown")$("again").click();
});
setsUI();build();
</script>
</body>
</html>
